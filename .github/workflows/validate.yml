name: Validate

on:
  push:
    branches-ignore: [release/version-update]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number for a target refresh. Leave empty to validate the selected ref.
        type: string
      head:
        description: Expected PR head SHA
        type: string
      base:
        description: Expected PR base SHA
        type: string
      target:
        description: Expected PR base branch
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    if: "!github.event.deleted"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      merge: ${{ steps.pr.outputs.merge }}
      version: ${{ steps.pr.outputs.version }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request' || inputs.pr != ''
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.workflow_sha }}
          path: .pr-control
          persist-credentials: false
      - name: Verify the PR merge identity
        id: pr
        if: github.event_name == 'pull_request' || inputs.pr != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.pr-control/.github/scripts/pr.cjs').resolvePR(github, context, core);
  validate:
    name: Validate integration
    needs: resolve
    concurrency:
      group: validate-${{ github.event.pull_request.number || inputs.pr || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.merge || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm target refresh uses the merge's validation workflow
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        run: |
          workflow=.github/workflows/validate.yml
          dispatched_blob=$(git rev-parse --verify "$GITHUB_WORKFLOW_SHA:$workflow")
          merged_blob=$(git rev-parse --verify "HEAD:$workflow")
          if [[ "$dispatched_blob" != "$merged_blob" ]]; then
            echo "::error::Validation workflow changed in the PR merge. Trigger a native pull_request run to use the merged workflow."
            exit 1
          fi
      - uses: ./.github/actions/integration-check
        if: needs.resolve.outputs.version != 'true'
      - name: Verify version and Changeset consumption
        if: needs.resolve.outputs.version == 'true'
        env:
          BASE: ${{ needs.resolve.outputs.base }}
          HEAD: ${{ needs.resolve.outputs.head }}
        run: python3 .github/scripts/version.py verify "$BASE" "$HEAD" "$(git rev-parse HEAD)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.resolve.outputs.version == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install from the frozen lockfile
        if: needs.resolve.outputs.version == 'true'
        run: npm ci --ignore-scripts
      - name: Check generated version files with Prettier
        if: needs.resolve.outputs.version == 'true'
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.head }}
        run: |
          message=$(git show -s --format=%B "$SOURCE_SHA")
          while IFS= read -r marker; do
            if [[ "$marker" != '[skip prettier]' ]]; then
              echo "::notice::Ignoring an unregistered skip marker on $SOURCE_SHA."
            fi
          done < <(printf '%s\n' "$message" | grep -oE '\[skip [^]]+\]' || true)
          if [[ "$message" == *'[skip prettier]'* ]]; then
            printf 'Prettier skipped for source commit %s via [skip prettier].\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            npm exec -- prettier --check package.json package-lock.json CHANGELOG.md .changeset/release.json custom_components/apple_find/manifest.json
          fi

      - name: Confirm the native PR merge is still current
        if: "!cancelled() && github.event_name == 'pull_request'"
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/pr.cjs').resolvePR(github, context, core);

  report:
    name: Confirm PR validation
    if: "!cancelled() && github.event_name == 'workflow_dispatch' && needs.resolve.outputs.merge != '' && needs.validate.result != 'cancelled'"
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VERIFIED_MERGE: ${{ needs.resolve.outputs.merge }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const merge = await require('./.github/scripts/pr.cjs').resolvePR(github, context, core);
            if (merge !== process.env.VERIFIED_MERGE) throw new Error('Merge identity changed during validation');
            const passed = process.env.VALIDATION_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: merge, state: passed ? 'success' : 'failure',
              context: 'Validate / target refresh',
              description: passed ? 'Current PR merge passed' : 'Current PR merge failed',
              target_url: process.env.RUN_URL,
            });
            if (!passed) core.setFailed('PR validation did not pass');
